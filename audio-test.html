<h1>iOS 音訊診斷</h1>
<p class="sub">用來找出切背景後聲音失效的真正原因。請照步驟做，然後把整頁截圖給我。</p>

<div class="card">
  <h2>測試步驟</h2>
  <ol>
    <li>按「播放測試音」，確認聽得到嗶聲</li>
    <li>按「啟動保活（MP3）」與「啟動保活（WAV）」</li>
    <li><b>切到別的 App 停留 30 秒</b>（最好播一下音樂）</li>
    <li>切回來，先看下面的數字，再按一次「播放測試音」</li>
    <li>截圖整頁給我</li>
  </ol>
</div>

  <h2>AudioContext（Web Audio）</h2>

  <div class="row"><span>時間有在前進嗎</span><b id="s-adv">—</b></div>
  <div class="row"><span>sampleRate</span><b id="s-rate">—</b></div>
</div>

<div class="card">
  <h2>無聲保活</h2>

  <div class="row"><span>MP3　播放位置</span><b id="m-time">—</b></div>
  <div class="row"><span>WAV　狀態</span><b id="w-state">未啟動</b></div>
  <div class="row"><span>WAV　播放位置</span><b id="w-time">—</b></div>
</div>

<div class="card">
  <h2>操作</h2>
  <button onclick="beep()">🔊 播放測試音</button>
  <button class="ghost" onclick="startMp3()">🔇 啟動保活（MP3）</button>
  <button class="ghost" onclick="startWav()">🔇 啟動保活（WAV）</button>
  <button class="ghost" onclick="document.getElementById('log').textContent=''">🗑 清空紀錄</button>
</div>

var ctx = null, mp3El = null, wavEl = null;
var lastT = -1, lastWall = 0, advancing = '—';

function log(msg){
  var el = document.getElementById('log');
  var t = new Date().toTimeString().slice(0,8);
  el.textContent = t + '  ' + msg + '\n' + el.textContent;
}
function ensureCtx(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    log('建立 AudioContext，state=' + ctx.state);
    try{ ctx.onstatechange = function(){ log('state 變成 ' + ctx.state); }; }catch(e){}
  }
  if(ctx.state !== 'running'){
    var p = ctx.resume();
    if(p && p.then) p.then(function(){ log('resume 成功，state=' + ctx.state); },
                           function(e){ log('resume 失敗：' + (e && e.message)); });
  }
  return ctx;
}
function beep(){
  var c = ensureCtx();
  try{
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.25, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 0.3);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.3);
    log('排程測試音（state=' + c.state + '，time=' + c.currentTime.toFixed(2) + '）');
  }catch(e){ log('播放測試音失敗：' + e.message); }
}
function makeEl(src, label){
  var a = new Audio(src);
  a.loop = true;
  a.setAttribute('playsinline','');
  a.addEventListener('play',  function(){ log(label + ' play 事件'); });
  a.addEventListener('pause', function(){ log(label + ' 被暫停了'); });
  a.addEventListener('ended', function(){ log(label + ' ended（沒有循環？）'); });
  a.addEventListener('error', function(){ log(label + ' 載入錯誤 code=' + (a.error && a.error.code)); });
  var p = a.play();
  if(p && p.then) p.then(function(){ log(label + ' play() 成功'); },
                         function(e){ log(label + ' play() 被拒絕：' + (e && e.name) + ' ' + (e && e.message)); });
  return a;
}
function startMp3(){ if(!mp3El) mp3El = makeEl(MP3, 'MP3'); else { mp3El.play(); log('MP3 重新播放'); } }
function startWav(){ if(!wavEl) wavEl = makeEl(WAV, 'WAV'); else { wavEl.play(); log('WAV 重新播放'); } }

function fmtEl(el){
  if(!el) return ['未啟動','—'];
  return [el.paused ? '已暫停 ✗' : '播放中 ✓', el.currentTime.toFixed(2)];
}
function tick(){
  if(ctx){
    var se = document.getElementById('s-state');
    se.textContent = ctx.state;
    se.className = ctx.state === 'running' ? 'ok' : 'bad';
    document.getElementById('s-time').textContent = ctx.currentTime.toFixed(3);
    document.getElementById('s-rate').textContent = ctx.sampleRate;
    var now = Date.now();
    if(lastT < 0){ lastT = ctx.currentTime; lastWall = now; }
    else if(now - lastWall > 400){
      advancing = (ctx.currentTime > lastT) ? '是 ✓' : '否 ✗（假死）';
      lastT = ctx.currentTime; lastWall = now;
    }
    var a = document.getElementById('s-adv');
    a.textContent = advancing;
    a.className = advancing.charAt(0) === '是' ? 'ok' : (advancing === '—' ? '' : 'bad');
  }
  var m = fmtEl(mp3El), w = fmtEl(wavEl);
  document.getElementById('m-state').textContent = m[0];
  document.getElementById('m-state').className = m[0].indexOf('✓') > 0 ? 'ok' : (m[0] === '未啟動' ? '' : 'bad');
  document.getElementById('m-time').textContent = m[1];
  document.getElementById('w-state').textContent = w[0];
  document.getElementById('w-state').className = w[0].indexOf('✓') > 0 ? 'ok' : (w[0] === '未啟動' ? '' : 'bad');
  document.getElementById('w-time').textContent = w[1];
}
setInterval(tick, 250);

document.addEventListener('visibilitychange', function(){
  log((document.hidden ? '→ 切到背景' : '← 回到前景') + (ctx ? '（state=' + ctx.state + '）' : ''));
});
window.addEventListener('pageshow', function(){ log('pageshow'); });
window.addEventListener('pagehide', function(){ log('pagehide'); });
